<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d5afe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Flashcards</title>
<style>
:root{
  --bg:#15171c;--fg:#f2f2f2;--mut:#b5b5b5;
  --card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.05);
  --bd:rgba(255,255,255,.14);--bd2:rgba(255,255,255,.24);
  --acc:#7c93ff;--back:rgba(255,255,255,.16);
  --ok:#3ecf8e;--warn:#ffb84d;--bad:#ff6b6b;
  --r:12px;--r2:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:background .25s,color .25s;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:20px 18px 80px;
  padding-left:max(18px,env(safe-area-inset-left));
  padding-right:max(18px,env(safe-area-inset-right));
  padding-bottom:max(80px,env(safe-area-inset-bottom))}
h1{font-size:1.55rem;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 10px}
.sub{color:var(--mut);margin:0;font-size:.93rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bgbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--bd);border-radius:999px;background:var(--card2)}
.bgbox small{color:var(--mut);font-size:.8rem}
.sw{width:20px;height:20px;padding:0;border-radius:50%;border:2px solid var(--bd);cursor:pointer}
.sw:hover{transform:scale(1.15)}
.tabs{display:flex;gap:2px;margin:0 0 18px;border-bottom:1px solid var(--bd)}
.tab{background:none;border:none;border-bottom:2px solid transparent;border-radius:0;
  padding:10px 14px;color:var(--mut);cursor:pointer;font:inherit;font-weight:500;
  transition:color .15s,border-color .15s;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--acc)}
button{font:inherit;color:var(--fg);padding:9px 14px;border-radius:var(--r);
  border:1px solid var(--bd);background:var(--card);cursor:pointer;
  transition:background .15s,border-color .15s,transform .06s,filter .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:rgba(255,255,255,.13);border-color:var(--bd2)}
button:active{transform:scale(.97)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.p:hover{filter:brightness(1.1);background:var(--acc)}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--card)}
button.danger{color:#ff9a9a;border-color:rgba(255,107,107,.35)}
button.danger:hover{background:rgba(255,107,107,.15)}
button.icon{padding:9px 12px;min-width:42px;font-size:1.05rem}
button.big{padding:13px 20px;font-size:1rem;font-weight:600;flex:1}
button[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
select,input[type=number],input[type=text],input[type=url],input[type=email],textarea{
  font:inherit;color:var(--fg);padding:9px 12px;
  border-radius:var(--r);border:1px solid var(--bd);background:var(--card)}
select option{color:#111}
textarea{resize:vertical;font-family:inherit;width:100%;min-height:60px}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none;cursor:pointer}
input[type=range]{accent-color:var(--acc)}
label{color:var(--mut);font-size:.9rem}
.hide{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.row.tight{margin:8px 0}
.center{justify-content:center}
.source-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
  padding:4px;border-radius:var(--r2);background:var(--card2);
  border:1px solid var(--bd);margin-bottom:14px}
.src-tab{background:transparent;border:none;color:var(--mut);font-weight:500;font-size:.9rem;
  padding:10px 8px;border-radius:12px;cursor:pointer;transition:all .15s}
.src-tab:hover{color:var(--fg);background:var(--card)}
.src-tab.on{background:var(--card);color:var(--fg);border:1px solid var(--bd2)}
#drop{position:relative;border:2px dashed var(--bd);border-radius:var(--r2);
  background:var(--card2);padding:44px 20px 40px;text-align:center;cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s;overflow:hidden}
#drop:hover{border-color:var(--bd2);background:var(--card)}
#drop.over{border-color:var(--acc);background:rgba(124,147,255,.10);transform:scale(1.01)}
#drop.over .drop-icon{transform:translateY(-4px) scale(1.12)}
#drop.over b{color:var(--acc)}
.drop-icon{font-size:2rem;line-height:1;margin-bottom:10px;display:block;transition:transform .2s ease}
#drop b{display:block;font-size:1.08rem;margin-bottom:4px}
#drop span{color:var(--mut);font-size:.9rem}
.filelist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.filerow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:10px 12px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--card);font-size:.9rem;animation:slideIn .18s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.filerow.reading{border-color:var(--acc);background:rgba(124,147,255,.08)}
.filerow.ready{border-color:rgba(62,207,142,.35)}
.filerow.error{border-color:rgba(255,107,107,.35);background:rgba(255,107,107,.06)}
.filerow .fstat{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;font-size:.75rem;
  background:var(--card2);border:1px solid var(--bd)}
.filerow.reading .fstat{border-color:var(--acc);background:rgba(124,147,255,.18)}
.filerow.ready .fstat{border-color:rgba(62,207,142,.5);background:rgba(62,207,142,.2);color:#a7eccb}
.filerow.error .fstat{border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.2);color:#ff9a9a}
.filerow .fstat.spin{animation:spin 1.2s linear infinite;border-color:transparent;border-top-color:var(--acc)}
@keyframes spin{to{transform:rotate(360deg)}}
.filerow .fbody{min-width:0}
.filerow .fname{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filerow .fmeta{color:var(--mut);font-size:.78rem;margin-top:2px}
.filerow .fdel{padding:5px 9px;font-size:.75rem;background:transparent;border-color:transparent;color:var(--mut)}
.filerow .fdel:hover{color:#ff9a9a;background:rgba(255,107,107,.1)}
.filelist-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:4px}
.url-row{display:flex;gap:8px;align-items:stretch}
.url-row input{flex:1;min-width:0}
.url-row button{flex-shrink:0}
.hint-line{color:var(--mut);font-size:.8rem;margin-top:8px;line-height:1.5}
#urlResult{margin-top:10px;font-size:.9rem}
#urlResult .ok{padding:10px 12px;border-radius:var(--r);background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.35);color:#a7eccb}
#urlResult .err{padding:10px 12px;border-radius:var(--r);background:rgba(255,107,107,.10);border:1px solid rgba(255,107,107,.35);color:#ffb0b0}
#urlResult .load{padding:10px 12px;border-radius:var(--r);background:var(--card2);border:1px solid var(--bd);color:var(--mut);display:flex;align-items:center;gap:8px}
#urlResult .load::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--bd2);border-top-color:var(--acc);animation:spin .8s linear infinite}
.textmeta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.8rem;color:var(--mut)}
#rawText{min-height:180px;font-size:.94rem;background:var(--card)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px;border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--card2);margin-top:14px}
.toolbar > *{margin:0}
.toolbar .field{display:flex;align-items:center;gap:6px}
#cardOpt{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#cardOpt.hide{display:none}
.focusbox{display:flex;flex-direction:column;gap:8px;
  padding:14px;border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--card2);margin-top:10px}
.focusbox label{font-size:.85rem}
.focusbox .hint{color:var(--mut);font-size:.78rem;margin-top:-4px}
.focusbox textarea{min-height:58px;font-size:.92rem;background:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-btn{padding:5px 10px;border-radius:999px;font-size:.78rem;
  border:1px solid var(--bd);background:transparent;color:var(--mut);
  cursor:pointer;transition:all .15s}
.chip-btn:hover{color:var(--fg);border-color:var(--bd2);background:var(--card)}
#progress{margin-top:16px;padding:14px 16px;border:1px solid var(--bd);
  border-radius:var(--r2);background:var(--card2);animation:slideIn .2s ease}
.prog-wrap{height:8px;border-radius:999px;overflow:hidden;background:var(--bd);margin-bottom:10px}
.prog-fill{height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--acc),#a5b7ff);transition:width .35s ease}
#progress.ai .prog-fill{background:linear-gradient(90deg,var(--acc) 0%,#a5b7ff 25%,var(--acc) 50%,#a5b7ff 75%,var(--acc) 100%);
  background-size:200% 100%;animation:slideGradient 2.2s linear infinite}
@keyframes slideGradient{from{background-position:0% 0}to{background-position:-200% 0}}
.prog-step{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;color:var(--fg)}
.prog-step .pct{color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums}
#progress.done .prog-fill{background:var(--ok)}
#progress.error .prog-fill{background:var(--bad)}
#summary{text-align:center;padding:40px 20px;border:1px solid var(--bd);border-radius:var(--r2);background:var(--card2);margin-top:20px}
#summary .big{font-size:2.4rem;font-weight:700;margin:6px 0}
#summary .lbl{color:var(--mut);font-size:.9rem;margin:0}
.deckitem{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  border:1px solid var(--bd);background:var(--card);border-radius:var(--r2);
  padding:14px 16px;margin:10px 0;transition:border-color .15s,background .15s}
.deckitem:hover{border-color:var(--bd2)}
.deckitem .nm{font-weight:600;display:flex;align-items:center;gap:8px;font-size:1rem;flex-wrap:wrap}
.deckitem .meta{color:var(--mut);font-size:.82rem;margin-top:3px}
.deckitem .btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--bd);flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;
  font-size:.72rem;font-weight:600;letter-spacing:.02em;
  background:var(--card2);border:1px solid var(--bd);color:var(--mut)}
.badge.due{background:rgba(124,147,255,.18);border-color:rgba(124,147,255,.4);color:#c6d2ff}
.badge.pub{background:rgba(62,207,142,.16);border-color:rgba(62,207,142,.4);color:#a7eccb}
.badge.cloud{background:rgba(255,184,77,.14);border-color:rgba(255,184,77,.35);color:#ffd199}
.badge.guest{background:rgba(180,180,180,.12);border-color:rgba(180,180,180,.3);color:var(--mut)}
.studyhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.studyhead .title{flex:1;font-size:1.15rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progline{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:.85rem;margin:4px 0 14px;flex-wrap:wrap}
#card{perspective:1200px;height:280px;cursor:pointer;margin:0 auto;user-select:none}
#inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
#card.flip #inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:40px 26px 26px;border:1px solid var(--bd);border-radius:var(--r2);
  background:var(--card);font-size:1.22rem;line-height:1.5;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--back);font-size:1.05rem}
.tag{position:absolute;top:12px;left:16px;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;opacity:.55;font-weight:600}
.spk{position:absolute;top:8px;right:8px;padding:6px 9px;font-size:.95rem;background:transparent;border-color:transparent;opacity:.55}
.spk:hover{opacity:1;background:var(--card2)}
.navrow{display:flex;gap:8px;margin:16px 0 8px;align-items:stretch}
.ratebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 0}
.rate{flex-direction:column;gap:1px;padding:11px 6px;font-weight:600;font-size:.9rem;border-width:1px}
.rate small{font-size:.7rem;opacity:.7;font-weight:500}
.rate.r0{color:#ffb0b0;border-color:rgba(255,107,107,.3)} .rate.r0:hover{background:rgba(255,107,107,.15)}
.rate.r1{color:#ffd199;border-color:rgba(255,184,77,.3)} .rate.r1:hover{background:rgba(255,184,77,.15)}
.rate.r2{color:#a7eccb;border-color:rgba(62,207,142,.3)} .rate.r2:hover{background:rgba(62,207,142,.15)}
.rate.r3{color:#c6d2ff;border-color:rgba(124,147,255,.3)} .rate.r3:hover{background:rgba(124,147,255,.15)}
details.tools{margin-top:18px;border:1px solid var(--bd);border-radius:var(--r2);background:var(--card2);overflow:hidden}
details.tools>summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--mut);
  list-style:none;display:flex;align-items:center;justify-content:space-between}
details.tools>summary::-webkit-details-marker{display:none}
details.tools>summary::after{content:"▾";transition:transform .2s;font-size:.8rem}
details.tools[open]>summary::after{transform:rotate(180deg)}
details.tools>summary:hover{color:var(--fg);background:var(--card)}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:4px 14px 14px}
.toolgrid button{justify-content:flex-start;padding:9px 12px;font-size:.88rem;background:var(--card)}
details.sub{grid-column:1/-1;border:1px solid var(--bd);border-radius:var(--r);background:var(--card2)}
details.sub>summary{padding:9px 12px;cursor:pointer;font-size:.88rem;font-weight:500;list-style:none;color:var(--mut)}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary:hover{color:var(--fg)}
details.sub .toolgrid{padding:4px 10px 10px}
#editList{margin-top:6px}
.editrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;
  border:1px solid var(--bd);border-radius:var(--r);background:var(--card);padding:10px;margin:8px 0;transition:border-color .15s}
.editrow:focus-within{border-color:var(--acc)}
.editnum{font-weight:600;color:var(--mut);font-size:.85rem;padding-top:10px;text-align:center}
.editfields{display:flex;flex-direction:column;gap:6px;min-width:0}
.editfields textarea{width:100%;font:inherit;font-size:.94rem;color:var(--fg);
  padding:9px 12px;border-radius:var(--r);border:1px solid var(--bd);
  background:var(--card2);resize:vertical;min-height:44px;font-family:inherit}
.editfields textarea:focus{outline:none;border-color:var(--acc)}
.editfields .lbl{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-2px}
.editdel{padding:8px 11px;align-self:start;font-size:.85rem}
.editempty{text-align:center;color:var(--mut);padding:30px 20px;border:1px dashed var(--bd);border-radius:var(--r2);margin:20px 0}
.editbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.editbar button{flex:1;min-width:120px}
#qbox{padding:8px 0}
#qbox h3{font-size:1.05rem;margin:0 0 16px;line-height:1.5}
.qopt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;font-size:.98rem}
.qopt.ok{border-color:var(--ok);background:rgba(62,207,142,.18)}
.qopt.no{border-color:var(--bad);background:rgba(255,107,107,.18)}
#out,#out2{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:8px 24px 20px;margin-top:14px;overflow-x:auto}
#out h1,#out2 h1{font-size:1.4rem;margin:.9em 0 .3em}
#out h2,#out2 h2{font-size:1.15rem;margin:1.2em 0 .3em;color:var(--acc)}
#out h3,#out2 h3{font-size:1rem;margin:1em 0 .2em}
#out ul,#out ol,#out2 ul,#out2 ol{padding-left:22px;margin:.3em 0}
#out p,#out2 p{margin:.5em 0}
#out code,#out2 code{background:var(--card2);padding:1px 5px;border-radius:4px;font-size:.9em}
.noteitem{border:1px solid var(--bd);background:var(--card);border-radius:var(--r2);
  padding:14px 16px;margin:10px 0;display:flex;justify-content:space-between;
  gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer;transition:border-color .15s}
.noteitem:hover{border-color:var(--bd2)}
.noteitem .nm{font-weight:600;margin-bottom:2px}
.noteitem .meta{color:var(--mut);font-size:.82rem}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;padding:8px 11px;border-radius:var(--r);
  border:1px solid transparent;color:var(--mut);font-size:1.15rem;line-height:1;transition:background .15s}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--card);color:var(--fg)}
.menu-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:50;
  background:#1b1e24;border:1px solid var(--bd2);border-radius:var(--r);
  padding:6px;min-width:200px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:2px}
.menu-panel button{justify-content:flex-start;border:none;background:transparent;text-align:left;padding:9px 12px;font-size:.9rem}
.menu-panel button:hover{background:var(--card)}
.menu-panel label{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-size:.9rem;color:var(--fg)}
.ttsbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;
  border:1px solid var(--bd);border-radius:var(--r);background:var(--card2);margin-top:10px;font-size:.85rem}
.ttsbar select{font-size:.85rem;padding:6px 10px}
.ttsbar input[type=range]{flex:1;min-width:80px;max-width:160px}
.userchip{
  display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;
  border:1px solid var(--bd);border-radius:999px;background:var(--card2);
  cursor:pointer;font-size:.85rem;color:var(--fg);
  transition:border-color .15s,background .15s}
.userchip:hover{border-color:var(--bd2);background:var(--card)}
.userchip .av{width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#7c93ff,#3d5afe);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem}
.userchip .em{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.userchip.signed .em{color:var(--fg)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .15s ease;backdrop-filter:blur(3px)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:#1b1e24;border:1px solid var(--bd2);border-radius:var(--r2);
  padding:22px;max-width:380px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  animation:popIn .2s cubic-bezier(.3,1.4,.5,1);position:relative}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{margin:0 0 6px;font-size:1.2rem}
.modal-x{position:absolute;top:10px;right:10px;padding:6px 10px;font-size:.9rem;
  background:transparent;border-color:transparent;color:var(--mut)}
.modal-x:hover{color:var(--fg);background:var(--card)}
.modal-card input{width:100%;margin:14px 0 10px}
.auth-divider{text-align:center;color:var(--mut);font-size:.8rem;margin:14px 0;position:relative}
.auth-divider::before,.auth-divider::after{content:"";position:absolute;top:50%;width:calc(50% - 20px);height:1px;background:var(--bd)}
.auth-divider::before{left:0} .auth-divider::after{right:0}
#authMsg{min-height:1.3em;text-align:center;margin-top:10px;font-size:.85rem}
#authMsg.ok{color:#a7eccb}
#authMsg.err{color:#ffb0b0}
